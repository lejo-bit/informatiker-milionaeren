<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Quiz – Fragen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Quiz – Fragen</h1>

    <div id="loading" class="loading">Fragen werden geladen...</div>
    <div id="error" class="error hidden"></div>

   <div id="startScreen" class="hidden">
  <label for="playerName">Dein Name:</label>
  <input type="text" id="playerName" placeholder="Nick eingeben..." />
  <button id="startBtn">Start</button>
</div>

    <div id="game" class="hidden">
      <div class="stats-bar">
  <div>Leben: <span id="lives">3</span></div>
  <div>Punkte: <span id="score">0</span> – <span id="playerLabel"></span></div>
  <div>Zeit: <span id="timer">30</span>s</div>
</div>

      <!-- Box z pytaniem -->
      <div class="question-box">
        <div id="questionText">Frage wird geladen...</div>
      </div>

      <!-- JEDEN input dla odpowiedzi otwartej -->
      <label for="answerInput">Deine Antwort:</label>
<input type="text" id="answerInput" placeholder="Antwort eingeben..." />

<div id="choiceContainer" class="hidden">
  <button class="choiceBtn"></button>
  <button class="choiceBtn"></button>
  <button class="choiceBtn"></button>
  <button class="choiceBtn"></button>
</div>

      <div class="buttons">
        <button id="checkBtn">Prüfen</button>
        <button id="nextBtn" class="secondary hidden">Nächste Frage</button>
      </div>

      <div id="resultBox" class="result hidden"></div>
      <div id="correctAnswerText" class="correct-answer hidden"></div>
    </div>

    <div id="gameOver" class="hidden">
      <h2>Spiel vorbei!</h2>
      <p>Erreichte Punkte: <span id="finalScore">0</span></p>
      <button id="restartBtn">Noch einmal spielen</button>
    </div>
  </div>

 <div id="scoreBoard">
  <h3>Bestenliste</h3>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Punkte</th>
      </tr>
    </thead>
    <tbody id="scoreTableBody"></tbody>
  </table>
</div>
  
<script type="module">
  import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  
  const firebaseConfig = {
    apiKey: "AIzaSyAxchRuByrEF-DTz25HCNJc4ab766N7AB8",
    authDomain: "quiz-fragen-80ed4.firebaseapp.com",
    projectId: "quiz-fragen-80ed4",
    storageBucket: "quiz-fragen-80ed4.firebasestorage.app",
    messagingSenderId: "1010639284688",
    appId: "1:1010639284688:web:56e7bbbe0bbac30724f1d5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // udostępnij db do użycia w script.js
  window.firebaseDb = db;

  // udostępnij też helpery Firestore w globalnym scope, żeby script.js je widział
  window.firebaseHelpers = {
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  limit
};
</script>
  
  <script type="module">
  console.log("Firebase module start");

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { ... };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  console.log("Firebase initialized", db);

  window.firebaseDb = db;
  window.firebaseHelpers = {
    collection,
    addDoc,
    getDocs,
    query,
    orderBy,
    limit
  };

  console.log("Helpers set", window.firebaseHelpers);
</script>
  <script src="checker.js"></script>
  <script src="numbers.js"></script>
  <script src="script.js"></script>
</body>
</html>
